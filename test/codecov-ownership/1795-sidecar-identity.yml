rationale: >-
  The existing-only sidecar evidence and binding checks remain local
  persistence work in src/db/events-path.ts. The diagnostic session lifetime
  and sidecar scanner remain local persistence work in
  src/db/diagnostic-sqlite.ts and src/db/event-sidecars.ts. Promotion admission and
