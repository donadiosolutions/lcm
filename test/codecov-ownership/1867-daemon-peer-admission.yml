references: ["#1867"]
rationale: >-
  Keeps local recipient process, private PID, listener and birth admission with
  service-manager lifecycle ownership, including the extracted existing platform
  attribution. The CLI, installer, diagnostics, hooks, MCP and publication callers
  retain their current owners while admitting the recipient before credentials
  and payloads. No production paths were removed or re-owned.
