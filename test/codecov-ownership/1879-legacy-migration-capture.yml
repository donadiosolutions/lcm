references: ["#1879"]
rationale: >-
  #1879 preserves the exact legacy migration target until finalization.
  runtime-paths keeps strict journal admission and pending-error recognition in
  configuration-security. The shared append gate and its publication-lock
  cleanup remain storage-abstractions owned. Local enqueue, hook propagation,
  and Codex receipt suppression remain hooks owned; static operator guidance
  remains CLI owned. No component classification changes.
