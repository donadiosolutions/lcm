references: ["#1549", "#1544"]
rationale: >-
  #1549 activates a cutover set through one publication. The new set
  activation service and the durable set activation records store
  (checkpoint and frozen selection) join the migration capture, copy and
  cutover owner next to the single-generation activation they compose.
  The writer quiescence module gains its separately named set entry
  point, and the maintenance module gains the set member replay
  admission; each keeps its existing migration owner. The storage
  journal gains the complete set selection tuple, its parser and the
  selection transitions for a set hold, and keeps its storage
  abstractions owner. No file is removed, moved or re-owned.
pins:
  - ["src/migration/cutover-set-activate.ts", "unit-migration-cutover"]
  - ["src/migration/cutover-set-activation-store.ts", "unit-migration-cutover"]
  - ["src/migration/activation-quiescence.ts", "unit-migration-cutover"]
  - ["src/migration/maintenance.ts", "unit-migration-cutover"]
  - ["src/storage/backend-publication.ts", "unit-storage-abstractions"]

