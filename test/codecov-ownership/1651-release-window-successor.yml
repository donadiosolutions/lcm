references: ["#1651"]
rationale: >-
  A migration activation or cutover-set retry now finishes when a crash left
  the backend publication journal at releasing or abort-releasing after the
  remote fence was released and another home acquired the released lease row.
  The PostgreSQL publication guard and remote guard gain a release
  reconciliation read, the publication driver declares it, the coordinator
  treats a successor row with a strictly greater fencing token as proof of
  release. The activation lease resolver marks a corrupt row, and the
  activation and cutover-set orchestrators admit a successor row during the
  release window only when it is not corrupt. Every file keeps its existing
  owner; no production file is added, removed, moved, or re-owned.
