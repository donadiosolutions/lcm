references: ["#637"]
rationale: >-
  #637 adds bounded PostgreSQL query-statistics collection to diagnostics and
  exports the exact repository SQL templates used by its starter catalog. The
  collector, snapshot integration, renderer, and doctor check remain
  diagnostics-owned; each repository retains its existing component owner.
