[package]
name = "lcm-daemon-restart-helper"
version = "0.0.0"
edition = "2024"
rust-version = "1.93.0"
publish = false

[[bin]]
name = "daemon-restart-helper"
path = "src/main.rs"

[dependencies]

[workspace]
resolver = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
