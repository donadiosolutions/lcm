name: Set up verified Rust toolchain
description: Install the checksum-verified Rust 1.93.0 Linux x64 musl toolchain.

runs:
  using: composite
  steps:
    - name: Install verified Rust 1.93.0 toolchain
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/install-verified-rust-toolchain.py" \
          --prefix "$RUNNER_TEMP/lcm-rust-1.93.0"

    - name: Expose verified Rust toolchain
      shell: bash
      run: |
        set -Eeuo pipefail
        printf '%s\n' "$RUNNER_TEMP/lcm-rust-1.93.0/bin" >> "$GITHUB_PATH"
