name: External admission

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  merge_group:
    types:
      - checks_requested
  # Provider result events intentionally restart exact-SHA admission after a
  # rerun, revoking stale success. Irrelevant events create skipped runs, but
  # identity-qualified concurrency groups keep that noise from the evaluator.
  status:
  check_run:
    types:
      - created
      - rerequested
      - completed

permissions:
  checks: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    external-admission-${{
      github.event_name == 'pull_request_target' && github.event.pull_request.head.sha ||
      github.event_name == 'status' && github.event.context == 'CodeRabbit' &&
        github.event.creator.id == 136622811 && github.event.creator.login == 'coderabbitai[bot]' &&
        github.event.sha ||
      github.event_name == 'check_run' &&
        ((github.event.check_run.name == 'codecov/patch' && github.event.check_run.app.id == 254 &&
          github.event.check_run.app.slug == 'codecov') ||
        (github.event.check_run.name == 'DCO' && github.event.check_run.app.id == 1861 &&
          github.event.check_run.app.slug == 'dco')) && github.event.check_run.head_sha ||
      github.event_name == 'status' &&
        format('status-{0}-{1}-{2}', github.event.sha, github.event.creator.id, github.event.context) ||
      github.event_name == 'check_run' &&
        format('check-run-{0}-{1}-{2}', github.event.check_run.head_sha,
          github.event.check_run.app.id, github.event.check_run.name) ||
      format('merge-group-{0}', github.sha)
    }}
  cancel-in-progress: true

jobs:
  external-admission-evaluator:
    name: external-admission-evaluator
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      (github.event_name == 'status' && github.event.context == 'CodeRabbit' &&
        github.event.creator.id == 136622811 && github.event.creator.login == 'coderabbitai[bot]') ||
      (github.event_name == 'check_run' &&
        ((github.event.check_run.name == 'codecov/patch' && github.event.check_run.app.id == 254 &&
          github.event.check_run.app.slug == 'codecov') ||
        (github.event.check_run.name == 'DCO' && github.event.check_run.app.id == 1861 &&
          github.event.check_run.app.slug == 'dco')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Wait for external admission checks
        env:
          EVENT_HEAD_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.event_name == 'status' && github.event.sha || github.event.check_run.head_sha }}
          EVENT_PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
        run: |
          set -Eeuo pipefail

          HEAD_SHA="$EVENT_HEAD_SHA"
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid pull request head SHA." >&2
            exit 1
          fi

          if [[ -n "$EVENT_PR_NUMBER" ]]; then
            PR_NUMBER="$EVENT_PR_NUMBER"
          else
            matching_prs="$(gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$REPOSITORY/commits/$HEAD_SHA/pulls?per_page=100")"
            PR_NUMBER="$(jq -r --arg sha "$HEAD_SHA" '
              [.[]
                | select(.state == "open")
                | select(.draft == false)
                | select(.base.ref == "main")
                | select(.head.sha == $sha)]
              | if length == 1 then .[0].number else empty end
            ' <<<"$matching_prs")"

            if [[ -z "$PR_NUMBER" ]]; then
              echo "Provider result does not identify exactly one eligible pull request; ignoring it."
              exit 0
            fi
          fi

          pull_request="$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e --arg sha "$HEAD_SHA" '
            .state == "open" and
            .draft == false and
            .base.ref == "main" and
            .head.sha == $sha
          ' <<<"$pull_request" >/dev/null; then
            echo "Pull request is no longer an eligible main-branch admission candidate; ignoring it."
            exit 0
          fi

          post_admission_status() {
            local state="$1"
            local description="$2"
            gh api --method POST \
              "repos/$REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$state" \
              -f context="external-admission" \
              -f description="$description" \
              -f target_url="$RUN_URL" >/dev/null
          }

          # Invoked indirectly by the EXIT trap.
          # shellcheck disable=SC2329
          admission_failed() {
            local exit_code=$?
            trap - EXIT
            if (( exit_code != 0 )); then
              post_admission_status failure \
                "External admission failed; inspect the workflow run" || true
            fi
            trap - INT TERM
            exit "$exit_code"
          }

          # GitHub cancels an obsolete concurrency-group run with INT, followed
          # by TERM if needed. Do not let its EXIT trap publish a failure after
          # the replacement run has published a newer status for the same SHA.
          # shellcheck disable=SC2329
          admission_cancelled() {
            local signal_name="$1"
            local exit_code="$2"
            trap - EXIT INT TERM
            echo "Run cancelled by $signal_name; leaving admission status unchanged."
            exit "$exit_code"
          }
          trap admission_failed EXIT
          trap 'admission_cancelled INT 130' INT
          trap 'admission_cancelled TERM 143' TERM

          post_admission_status pending \
            "Waiting for CodeRabbit, Codecov patch, and DCO"

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            commit_statuses="$(gh api \
              "repos/$REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100")"
            check_runs="$(gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")"

            coderabbit_state="$(jq -r '
              [.[]
                | select(.context == "CodeRabbit")
                | select(.creator.id == 136622811)
                | select(.creator.login == "coderabbitai[bot]")]
              | sort_by(.id)
              | last
              | .state // "missing"
            ' <<<"$commit_statuses")"
            codecov_state="$(jq -r '
              [.check_runs[]
                | select(.name == "codecov/patch")
                | select(.app.id == 254)
                | select(.app.slug == "codecov")]
              | sort_by(.id)
              | last
              | if . == null then "missing"
                elif .status != "completed" then .status
                else .conclusion // "missing"
                end
            ' <<<"$check_runs")"
            dco_state="$(jq -r '
              [.check_runs[]
                | select(.name == "DCO")
                | select(.app.id == 1861)
                | select(.app.slug == "dco")]
              | sort_by(.id)
              | last
              | if . == null then "missing"
                elif .status != "completed" then .status
                else .conclusion // "missing"
                end
            ' <<<"$check_runs")"

            echo "CodeRabbit=$coderabbit_state Codecov=$codecov_state DCO=$dco_state"

            for provider_state in \
              "$coderabbit_state" "$codecov_state" "$dco_state"; do
              case "$provider_state" in
                success | missing | pending | queued | in_progress | requested | waiting)
                  ;;
                *)
                  echo "External provider reported terminal state: $provider_state" >&2
                  exit 1
                  ;;
              esac
            done

            if [[ "$coderabbit_state" == success && \
              "$codecov_state" == success && "$dco_state" == success ]]; then
              post_admission_status success \
                "CodeRabbit, Codecov patch, and DCO passed"
              trap - EXIT INT TERM
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for external admission checks." >&2
          exit 1

  external-admission:
    name: external-admission
    if: ${{ github.event_name == 'merge_group' }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Accept previously admitted merge group
        run: |
          set -Eeuo pipefail

          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid merge-group SHA." >&2
            exit 1
          fi

          # Every PR was admitted only after all three providers succeeded on
          # its exact head SHA. They do not report on synthetic merge commits.
          echo "External providers passed before merge-queue admission."
