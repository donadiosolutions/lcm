name: External admission

on:
  # Provider result events intentionally restart exact-SHA admission after a
  # rerun, revoking stale success. Irrelevant events create skipped runs, but
  # identity-qualified concurrency groups keep that noise from the evaluator.
  check_run:
    types:
      - created
      - rerequested
      - completed

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    external-admission-${{
      github.event_name == 'check_run' &&
        ((github.event.check_run.name == 'codecov/patch' && github.event.check_run.app.id == 254 &&
          github.event.check_run.app.slug == 'codecov') ||
        (github.event.check_run.name == 'DCO' && github.event.check_run.app.id == 1861 &&
          github.event.check_run.app.slug == 'dco')) && github.event.check_run.head_sha ||
      github.event_name == 'check_run' &&
        format('check-run-{0}-{1}-{2}', github.event.check_run.head_sha,
          github.event.check_run.app.id, github.event.check_run.name)
    }}
  cancel-in-progress: true

jobs:
  external-admission-evaluator:
    name: external-admission-evaluator
    # CI is polled but never starts this evaluator: it also reports on
    # merge-group SHAs, which belong to external-admission-merge-group.yml.
    if: >-
      github.event_name == 'check_run' &&
        ((github.event.check_run.name == 'codecov/patch' && github.event.check_run.app.id == 254 &&
          github.event.check_run.app.slug == 'codecov') ||
        (github.event.check_run.name == 'DCO' && github.event.check_run.app.id == 1861 &&
          github.event.check_run.app.slug == 'dco'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SERVER_URL: ${{ github.server_url }}
    steps:
      # Revocation deliberately precedes checkout and every PR lookup. If a
      # later trust check fails, the exact commit cannot retain stale success.
      - name: Revoke stale external admission
        env:
          EVENT_HEAD_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid pull request head SHA." >&2
            exit 1
          fi

          gh api --method POST \
            "repos/$REPOSITORY/statuses/$EVENT_HEAD_SHA" \
            -f state="pending" \
            -f context="external-admission" \
            -f description="Revalidating pull request and required checks" \
            -f target_url="$RUN_URL" >/dev/null

      # The policy must come from the workflow revision, never from the
      # untrusted pull-request head whose files it classifies.
      - name: Check out trusted admission policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/external-admission-policy.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Wait for external admission checks
        env:
          EVENT_HEAD_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          set -Eeuo pipefail

          HEAD_SHA="$EVENT_HEAD_SHA"
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid pull request head SHA." >&2
            exit 1
          fi

          resolve_eligible_pr_number() {
            jq -r --arg sha "$HEAD_SHA" '
              [.[]
                | select(.state == "open")
                | select(.draft == false)
                | select(.base.ref == "main")
                | select(.head.sha == $sha)]
              | if length == 1 then .[0].number else empty end
            '
          }

          pull_request_is_eligible() {
            jq -e --arg sha "$HEAD_SHA" '
              .state == "open" and
              .draft == false and
              .base.ref == "main" and
              .head.sha == $sha
            ' >/dev/null
          }

          post_admission_status() {
            local state="$1"
            local description="$2"
            gh api --method POST \
              "repos/$REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$state" \
              -f context="external-admission" \
              -f description="$description" \
              -f target_url="$RUN_URL" >/dev/null
          }

          fetch_associated_pull_requests() {
            gh api --paginate --slurp \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$REPOSITORY/commits/$HEAD_SHA/pulls?per_page=100" \
              | jq -c 'flatten(1)'
          }

          fetch_pull_request_files() {
            gh api --paginate --slurp \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100"
          }

          classify_pull_request_files() {
            local expected_count="$1"
            node .github/scripts/external-admission-policy.mjs classify-files "$expected_count"
          }

          evaluate_check_runs() {
            local codecov_required="$1"
            node .github/scripts/external-admission-policy.mjs evaluate-checks \
              "$HEAD_SHA" "$codecov_required" "$REPOSITORY" "$SERVER_URL"
          }

          validate_ci_run() {
            local run_id="$1"
            node .github/scripts/external-admission-policy.mjs validate-ci-run \
              "$run_id" "$HEAD_SHA" "$REPOSITORY"
          }

          # Invoked indirectly by the EXIT trap.
          # shellcheck disable=SC2329
          admission_failed() {
            local exit_code=$?
            trap - EXIT
            if (( exit_code != 0 )); then
              post_admission_status failure \
                "External admission failed; inspect the workflow run" || true
            fi
            trap - INT TERM
            exit "$exit_code"
          }

          # GitHub cancels an obsolete concurrency-group run with INT, followed
          # by TERM if needed. Do not let its EXIT trap publish a failure after
          # the replacement run has published a newer status for the same SHA.
          # shellcheck disable=SC2329
          admission_cancelled() {
            local signal_name="$1"
            local exit_code="$2"
            trap - EXIT INT TERM
            echo "Run cancelled by $signal_name; leaving admission status unchanged."
            exit "$exit_code"
          }
          trap admission_failed EXIT
          trap 'admission_cancelled INT 130' INT
          trap 'admission_cancelled TERM 143' TERM

          matching_prs="$(fetch_associated_pull_requests)"
          PR_NUMBER="$(resolve_eligible_pr_number <<<"$matching_prs")"

          if [[ -z "$PR_NUMBER" ]]; then
            echo "Provider result does not identify exactly one eligible pull request; admission remains pending."
            exit 0
          fi

          pull_request="$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          if ! pull_request_is_eligible <<<"$pull_request"; then
            echo "Pull request is no longer an eligible main-branch admission candidate; admission remains pending."
            exit 0
          fi

          changed_file_count="$(jq -r '.changed_files' <<<"$pull_request")"
          file_pages="$(fetch_pull_request_files)"
          classification="$(classify_pull_request_files "$changed_file_count" <<<"$file_pages")"
          codecov_required="$(jq -r '.codecovRequired' <<<"$classification")"
          classification_name="$(jq -r '.classification' <<<"$classification")"
          echo "Admission classification=$classification_name"

          if [[ "$codecov_required" == true ]]; then
            waiting_description="Waiting for Codecov patch and DCO"
            success_description="Codecov patch and DCO passed"
          else
            waiting_description="Waiting for trusted CI and DCO"
            success_description="CI and DCO passed for coverage-neutral diff"
          fi
          post_admission_status pending "$waiting_description"

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            check_run_pages="$(gh api --paginate --slurp \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")"
            evaluation="$(evaluate_check_runs "$codecov_required" <<<"$check_run_pages")"
            echo "Check states: $(jq -c '.states' <<<"$evaluation")"

            terminal_failure="$(jq -r '.terminalFailure // empty' <<<"$evaluation")"
            if [[ -n "$terminal_failure" ]]; then
              echo "Required check reported an invalid or terminal state: $terminal_failure" >&2
              exit 1
            fi

            if [[ "$(jq -r '.ready' <<<"$evaluation")" == true ]]; then
              if [[ "$codecov_required" == false ]]; then
                ci_run_id="$(jq -r '.ciRunId' <<<"$evaluation")"
                ci_run="$(gh api \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "repos/$REPOSITORY/actions/runs/$ci_run_id")"
                if ! validate_ci_run "$ci_run_id" <<<"$ci_run"; then
                  echo "Successful CI check is not backed by the required pull-request workflow run." >&2
                  exit 1
                fi
              fi

              current_matching_prs="$(fetch_associated_pull_requests)"
              current_pr_number="$(resolve_eligible_pr_number <<<"$current_matching_prs")"
              if [[ "$current_pr_number" != "$PR_NUMBER" ]]; then
                post_admission_status pending \
                  "Pull request is no longer uniquely eligible for admission"
                echo "Pull request eligibility changed while providers were running; admission remains pending."
                trap - EXIT INT TERM
                exit 0
              fi

              current_pull_request="$(gh api \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$REPOSITORY/pulls/$current_pr_number")"
              if ! pull_request_is_eligible <<<"$current_pull_request"; then
                post_admission_status pending \
                  "Pull request is no longer eligible for admission"
                echo "Pull request eligibility changed while providers were running; admission remains pending."
                trap - EXIT INT TERM
                exit 0
              fi

              current_changed_file_count="$(jq -r '.changed_files' <<<"$current_pull_request")"
              current_file_pages="$(fetch_pull_request_files)"
              current_classification="$(
                classify_pull_request_files "$current_changed_file_count" <<<"$current_file_pages"
              )"
              if [[ "$(jq -r '.classification' <<<"$current_classification")" != "$classification_name" ]]; then
                post_admission_status pending \
                  "Pull request file classification changed during admission"
                echo "Pull request file classification changed; admission remains pending."
                trap - EXIT INT TERM
                exit 0
              fi

              current_check_run_pages="$(gh api --paginate --slurp \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")"
              current_evaluation="$(evaluate_check_runs "$codecov_required" <<<"$current_check_run_pages")"
              current_terminal_failure="$(jq -r '.terminalFailure // empty' <<<"$current_evaluation")"
              if [[ -n "$current_terminal_failure" ]]; then
                echo "Required check changed to an invalid or terminal state: $current_terminal_failure" >&2
                exit 1
              fi
              if [[ "$(jq -r '.ready' <<<"$current_evaluation")" != true ]]; then
                post_admission_status pending \
                  "Required checks changed during final admission validation"
                echo "Required checks changed; admission remains pending."
                trap - EXIT INT TERM
                exit 0
              fi
              if [[ "$codecov_required" == false ]]; then
                current_ci_run_id="$(jq -r '.ciRunId' <<<"$current_evaluation")"
                current_ci_run="$(gh api \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "repos/$REPOSITORY/actions/runs/$current_ci_run_id")"
                if ! validate_ci_run "$current_ci_run_id" <<<"$current_ci_run"; then
                  echo "CI run metadata changed during final admission validation." >&2
                  exit 1
                fi
              fi

              final_matching_prs="$(fetch_associated_pull_requests)"
              final_pr_number="$(resolve_eligible_pr_number <<<"$final_matching_prs")"
              if [[ "$final_pr_number" != "$PR_NUMBER" ]]; then
                post_admission_status pending \
                  "Pull request is no longer uniquely eligible for admission"
                echo "Final pull request association changed; admission remains pending."
                trap - EXIT INT TERM
                exit 0
              fi
              final_pull_request="$(gh api \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$REPOSITORY/pulls/$final_pr_number")"
              if ! pull_request_is_eligible <<<"$final_pull_request"; then
                post_admission_status pending \
                  "Pull request is no longer eligible for admission"
                echo "Final pull request eligibility changed; admission remains pending."
                trap - EXIT INT TERM
                exit 0
              fi

              post_admission_status success "$success_description"
              trap - EXIT INT TERM
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for external admission checks." >&2
          exit 1
