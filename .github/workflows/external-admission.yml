name: External admission

on:
  # Provider result events intentionally restart exact-SHA admission after a
  # rerun, revoking stale success. Irrelevant events create skipped runs, but
  # identity-qualified concurrency groups keep that noise from the evaluator.
  check_run:
    types:
      - created
      - rerequested
      - completed
  # GitHub suppresses check_run workflow recursion for checks produced by
  # Actions. Use the canonical CI workflow lifecycle as the trusted wake-up
  # source instead of occupying a runner while polling its aggregate check.
  workflow_run:
    workflows:
      - CI
    types:
      - requested
      - in_progress
      - completed
  # Default-branch repository dispatch is the fail-closed recovery path if an
  # external provider event is delayed or lost. Unlike workflow_dispatch, the
  # caller cannot select an untrusted branch revision of this workflow.
  repository_dispatch:
    types:
      - external-admission-reconcile

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    external-admission-${{
      github.event_name == 'repository_dispatch' &&
        github.event.action == 'external-admission-reconcile' &&
        github.event.client_payload.head_sha ||
      github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'CI' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.head_sha ||
      github.event_name == 'workflow_run' &&
        format('workflow-run-{0}', github.run_id) ||
      github.event_name == 'check_run' &&
        ((github.event.check_run.name == 'Greptile Review' && github.event.check_run.app.id == 867647 &&
          github.event.check_run.app.slug == 'greptile-apps') ||
        (github.event.check_run.name == 'DCO' && github.event.check_run.app.id == 1861 &&
          github.event.check_run.app.slug == 'dco')) && github.event.check_run.head_sha ||
      github.event_name == 'check_run' &&
        format('check-run-{0}-{1}-{2}', github.event.check_run.head_sha,
          github.event.check_run.app.id, github.event.check_run.name)
    }}
  cancel-in-progress: true

jobs:
  external-admission-evaluator:
    name: external-admission-evaluator
    # CI wake-ups are limited to the canonical pull-request workflow. Push and
    # merge-group runs are owned by their native required checks and the
    # permissionless external-admission-merge-group workflow.
    if: >-
      (github.event_name == 'repository_dispatch' &&
        github.event.action == 'external-admission-reconcile' &&
        github.event.client_payload.head_sha != '') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'CI' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.full_name == github.repository) ||
      (github.event_name == 'check_run' &&
        ((github.event.check_run.name == 'Greptile Review' && github.event.check_run.app.id == 867647 &&
          github.event.check_run.app.slug == 'greptile-apps') ||
        (github.event.check_run.name == 'DCO' && github.event.check_run.app.id == 1861 &&
          github.event.check_run.app.slug == 'dco')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SERVER_URL: ${{ github.server_url }}
    steps:
      # Revocation deliberately precedes checkout and every PR lookup. If a
      # later trust check fails, the exact commit cannot retain stale success.
      - name: Revoke stale external admission
        env:
          EVENT_HEAD_SHA: >-
            ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha ||
                github.event_name == 'workflow_run' && github.event.workflow_run.head_sha ||
                github.event.check_run.head_sha }}
        run: |
          set -Eeuo pipefail

          EVENT_HEAD_SHA="${EVENT_HEAD_SHA,,}"
          if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request head SHA." >&2
            exit 1
          fi

          gh api --method POST \
            "repos/$REPOSITORY/statuses/$EVENT_HEAD_SHA" \
            -f state="pending" \
            -f context="external-admission" \
            -f description="Revalidating pull request and required checks" \
            -f target_url="$RUN_URL" >/dev/null

      # The evaluator and policy must come from the workflow revision, never
      # from the untrusted pull-request head whose files they classify.
      - name: Check out trusted admission evaluator
        if: ${{ (github.event_name == 'repository_dispatch' && github.event.action == 'external-admission-reconcile' && github.event.client_payload.head_sha != '') || github.event.action == 'completed' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/external-admission.sh
            .github/scripts/external-admission-policy.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        if: ${{ (github.event_name == 'repository_dispatch' && github.event.action == 'external-admission-reconcile' && github.event.client_payload.head_sha != '') || github.event.action == 'completed' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"

      - name: Evaluate external admission snapshot
        if: ${{ (github.event_name == 'repository_dispatch' && github.event.action == 'external-admission-reconcile' && github.event.client_payload.head_sha != '') || github.event.action == 'completed' }}
        env:
          EVENT_HEAD_SHA: >-
            ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha ||
                github.event_name == 'workflow_run' && github.event.workflow_run.head_sha ||
                github.event.check_run.head_sha }}
          EVENT_SOURCE: ${{ github.event_name }}
          EVENT_WORKFLOW_RUN_ID: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: bash .github/scripts/external-admission.sh
