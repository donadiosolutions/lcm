name: Version Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Enter beta prerelease mode or exit an active beta for a stable release.
        required: true
        type: choice
        options:
          - beta
          - stable

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for earlier version runs
        timeout-minutes: 65
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const currentRunId = Number(context.runId);
            if (!Number.isSafeInteger(currentRunId)) {
              throw new Error(`Invalid workflow run id ${context.runId}`);
            }
            const timeoutMs = 60 * 60 * 1000;
            const pollMs = 15 * 1000;
            const startedAt = performance.now();
            for (;;) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo,
                workflow_id: "version-pr.yml",
                per_page: 100,
              });
              const earlierActiveRuns = runs
                .filter(
                  (run) =>
                    run.id < currentRunId &&
                    run.status !== "completed" &&
                    ["push", "workflow_dispatch"].includes(run.event),
                )
                .sort((left, right) => left.id - right.id);
              if (earlierActiveRuns.length === 0) break;
              if (performance.now() - startedAt >= timeoutMs) {
                throw new Error(
                  `Timed out waiting for earlier version runs: ${earlierActiveRuns.map((run) => run.id).join(", ")}`,
                );
              }
              core.info(
                `Waiting for earlier version runs: ${earlierActiveRuns.map((run) => `${run.id} (${run.event}/${run.status})`).join(", ")}`,
              );
              await new Promise((resolve) => setTimeout(resolve, pollMs));
            }

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Open or update release PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          branch: main
          commit: "chore: version packages"
          commitMode: github-api
          title: "chore: version packages"
          version: npm run version-packages
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LCM_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'auto' }}

      - name: Exclude version PR from release notes
        if: ${{ steps.changesets.outputs.pullRequestNumber != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number <= 0) {
              throw new Error(`Invalid Changesets PR number: ${process.env.PR_NUMBER}`);
            }

            const name = "no-release-notes";
            try {
              await github.rest.issues.getLabel({ ...context.repo, name });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name,
                  color: "ededed",
                  description: "Exclude this pull request from generated release notes",
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number,
              labels: [name],
            });
