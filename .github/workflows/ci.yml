name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    name: Initialize CI environment
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      node-modules-cache-hit: ${{ steps.setup.outputs.node-modules-cache-hit }}
      images-cache-hit: ${{ steps.setup.outputs.images-cache-hit }}
      postgresql-template-cache-hit: ${{ steps.setup.outputs.postgresql-template-cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize and seed CI environment
        id: setup
        uses: ./.github/actions/setup-ci
        with:
          stage-postgresql: "true"

  core:
    name: Core CI
    needs: environment
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CI environment
        uses: ./.github/actions/setup-ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:ci

      - name: Test GitHub policy modules
        run: node --test .github/scripts/*.test.mjs

      - name: Upload Vitest reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-reports
          path: |
            coverage/
            test-report.junit.xml
          if-no-files-found: warn

      - name: Build
        run: npm run build

      - name: Check for workspace artifacts
        run: |
          git diff --exit-code
          UNTRACKED=$(git status --porcelain | grep "^??" | grep -vE "^\?\? (node_modules|dist|coverage)/|^\?\? test-report\.junit\.xml$" || true)
          if [ -n "$UNTRACKED" ]; then
            echo "❌ Tests or build left unexpected untracked files in the workspace:"
            echo "$UNTRACKED"
            echo ""
            echo "Ensure all temp files go to os.tmpdir(), not process.cwd(). Tests must clean up after themselves."
            exit 1
          fi
          echo "✅ Workspace is clean"

  postgresql:
    name: PostgreSQL 18 conformance (${{ matrix.run }})
    needs: environment
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CI environment
        uses: ./.github/actions/setup-ci
        with:
          stage-postgresql: "true"

      - name: Run isolated PostgreSQL 18 conformance harness
        run: npm run test:postgresql

  native:
    name: Native helper toolchain
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up verified Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Compile static Linux x64 musl toolchain check
        run: |
          set -Eeuo pipefail
          printf '%s\n' 'fn main() {}' \
            | rustc --target x86_64-unknown-linux-musl -o "$RUNNER_TEMP/lcm-musl-toolchain-check" -
          test -x "$RUNNER_TEMP/lcm-musl-toolchain-check"

  ci:
    name: ci
    needs:
      - environment
      - core
      - postgresql
      - native
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI suite
        env:
          ENVIRONMENT_RESULT: ${{ needs.environment.result }}
          CORE_RESULT: ${{ needs.core.result }}
          POSTGRESQL_RESULT: ${{ needs.postgresql.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          set -Eeuo pipefail
          if [[ "$ENVIRONMENT_RESULT" != success || "$CORE_RESULT" != success || "$POSTGRESQL_RESULT" != success || "$NATIVE_RESULT" != success ]]; then
            echo "Environment result: $ENVIRONMENT_RESULT" >&2
            echo "Core CI result: $CORE_RESULT" >&2
            echo "PostgreSQL matrix result: $POSTGRESQL_RESULT" >&2
            echo "Native toolchain result: $NATIVE_RESULT" >&2
            exit 1
          fi
          echo "Environment, Core CI, every PostgreSQL matrix run, and the native toolchain passed."

  codecov:
    name: Codecov upload
    needs: ci
    if: ${{ github.event_name != 'merge_group' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      # Download the fixed report artifact produced by this workflow run.
      actions: read
      # Make the artifact-producing tree available for Codecov path reconciliation.
      contents: read
      # Enable Codecov OIDC authentication without a repository secret.
      id-token: write
    steps:
      - name: Checkout source for Codecov
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Vitest reports
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$REPOSITORY" \
            --name vitest-reports \
            --dir .

      - name: Download verified Codecov CLI
        env:
          GH_TOKEN: ${{ github.token }}
          CODECOV_CLI_REPOSITORY: codecov/codecov-cli
          CODECOV_CLI_TAG: v11.2.6
          CODECOV_CLI_ASSET: codecovcli_linux
          CODECOV_CLI_SHA256: fd34214e2b2c738e48e3ac90b2c23ec4e975d0e9aee51f2cebe81b5704af3f6c
        run: |
          set -Eeuo pipefail
          CODECOV_CLI_PATH="$RUNNER_TEMP/codecov"
          gh release download "$CODECOV_CLI_TAG" \
            --repo "$CODECOV_CLI_REPOSITORY" \
            --pattern "$CODECOV_CLI_ASSET" \
            --output "$CODECOV_CLI_PATH"
          printf '%s  %s\n' "$CODECOV_CLI_SHA256" "$CODECOV_CLI_PATH" \
            | sha256sum --check --strict
          chmod 0755 "$CODECOV_CLI_PATH"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          override_pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          files: coverage/lcov.info
          disable_search: true
          binary: ${{ runner.temp }}/codecov
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          override_pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          files: test-report.junit.xml
          disable_search: true
          report_type: test_results
          binary: ${{ runner.temp }}/codecov
          fail_ci_if_error: true

  codecov-fork:
    name: Codecov upload (fork)
    needs: ci
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    permissions:
      # Download the fixed report artifact produced by this workflow run.
      actions: read
      # Make the artifact-producing tree available for Codecov path reconciliation.
      contents: read
    steps:
      - name: Checkout source for Codecov
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Vitest reports
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$REPOSITORY" \
            --name vitest-reports \
            --dir .

      - name: Download verified Codecov CLI
        env:
          GH_TOKEN: ${{ github.token }}
          CODECOV_CLI_REPOSITORY: codecov/codecov-cli
          CODECOV_CLI_TAG: v11.2.6
          CODECOV_CLI_ASSET: codecovcli_linux
          CODECOV_CLI_SHA256: fd34214e2b2c738e48e3ac90b2c23ec4e975d0e9aee51f2cebe81b5704af3f6c
        run: |
          set -Eeuo pipefail
          CODECOV_CLI_PATH="$RUNNER_TEMP/codecov"
          gh release download "$CODECOV_CLI_TAG" \
            --repo "$CODECOV_CLI_REPOSITORY" \
            --pattern "$CODECOV_CLI_ASSET" \
            --output "$CODECOV_CLI_PATH"
          printf '%s  %s\n' "$CODECOV_CLI_SHA256" "$CODECOV_CLI_PATH" \
            | sha256sum --check --strict
          chmod 0755 "$CODECOV_CLI_PATH"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: false
          override_pr: ${{ github.event.pull_request.number }}
          files: coverage/lcov.info
          disable_search: true
          binary: ${{ runner.temp }}/codecov
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: false
          override_pr: ${{ github.event.pull_request.number }}
          files: test-report.junit.xml
          disable_search: true
          report_type: test_results
          binary: ${{ runner.temp }}/codecov
          fail_ci_if_error: true
