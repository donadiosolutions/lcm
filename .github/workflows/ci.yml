name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:ci

      - name: Upload Vitest reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-reports
          path: |
            coverage/
            test-report.junit.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          version: v11.2.6
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-report.junit.xml
          disable_search: true
          report_type: test_results
          version: v11.2.6
          fail_ci_if_error: true

      - name: Clean Codecov uploader files
        if: ${{ !cancelled() }}
        run: rm -f codecov codecov.SHA256SUM codecov.SHA256SUM.sig

      - name: Build
        run: npm run build

      - name: Check for workspace artifacts
        run: |
          UNTRACKED=$(git status --porcelain | grep "^??" | grep -vE "^\?\? (node_modules|dist|coverage)/|^\?\? test-report\.junit\.xml$" || true)
          if [ -n "$UNTRACKED" ]; then
            echo "❌ Tests or build left unexpected untracked files in the workspace:"
            echo "$UNTRACKED"
            echo ""
            echo "Ensure all temp files go to os.tmpdir(), not process.cwd(). Tests must clean up after themselves."
            exit 1
          fi
          echo "✅ Workspace is clean"
