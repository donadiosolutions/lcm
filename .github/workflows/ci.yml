name: CI

# Job graph (see docs/development.md, "Continuous integration"):
#
#   plan ─┬─ checks ────────────────────────────┐
#         ├─ unit (matrix from plan) ─ report ──┼─ ci
#         │                             └─ codecov (main/release only)
#         ├─ postgresql (when planned) ─────────┤
#         ├─ linux-systemd (when planned) ──────┤
#         └─ macos-launchd (when planned) ──────┘
#
# `plan` decides the mode: pushes to main/release run every test file with
# coverage and the merged report must reach 100% per file; pull requests and
# merge-queue entries run only the test files related to the change.

on:
  push:
    branches:
      - main
      - release
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      coverage: ${{ steps.plan.outputs.coverage }}
      unit: ${{ steps.plan.outputs.unit }}
      postgresql: ${{ steps.plan.outputs.postgresql }}
      systemd: ${{ steps.plan.outputs.systemd }}
      launchd: ${{ steps.plan.outputs.launchd }}
      shards: ${{ steps.plan.outputs.shards }}
      expected-file-count: ${{ steps.plan.outputs.expected-file-count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The planner needs the merge base of the change.
          fetch-depth: 0

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node

      - name: Plan the run
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-plan.mjs --event "$EVENT_NAME" --ref "$REF" --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Seed PostgreSQL harness caches
        if: ${{ steps.plan.outputs.postgresql == 'true' }}
        uses: ./.github/actions/stage-postgresql

  checks:
    name: Checks
    needs: plan
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node

      - name: Type-check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test GitHub policy modules
        run: node --test .github/scripts/*.test.mjs

      - name: Test helper regressions
        run: python3 -B -m unittest discover -s .agents/skills/tests -v

      - name: Check for workspace artifacts
        run: bash .github/scripts/check-workspace-clean.sh

  unit:
    name: Unit (${{ matrix.name }})
    needs: plan
    if: ${{ needs.plan.outputs.unit == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node

      - name: Run Vitest shard
        uses: ./.github/actions/vitest-shard
        with:
          name: ${{ matrix.name }}
          projects: ${{ matrix.projects }}
          files: ${{ matrix.files }}
          coverage: ${{ needs.plan.outputs.coverage }}
          artifact-root: ${{ runner.temp }}/lcm-vitest-${{ github.run_id }}-${{ github.run_attempt }}

  report:
    name: Report
    needs:
      - plan
      - unit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      # Download the shard blobs produced by this workflow run.
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node

      - name: Download shard blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          download_root="$RUNNER_TEMP/lcm-blob-downloads"
          blob_root="$RUNNER_TEMP/lcm-blobs"
          mkdir -p "$download_root" "$blob_root"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$REPOSITORY" \
            --pattern 'vitest-blob-*' \
            --dir "$download_root"
          find "$download_root" -mindepth 2 -maxdepth 2 -type f -name '*.json' -exec mv -t "$blob_root" -- {} +
          ls -l "$blob_root"

      - name: Merge shard reports
        env:
          LCM_TEST_ARTIFACT_ROOT: ${{ runner.temp }}/lcm-vitest-${{ github.run_id }}-${{ github.run_attempt }}
          LCM_CI_BLOB_DIRECTORY: ${{ runner.temp }}/lcm-blobs
          LCM_CI_COVERAGE: ${{ needs.plan.outputs.coverage }}
          LCM_CI_EXPECTED_FILE_COUNT: ${{ needs.plan.outputs.expected-file-count }}
        run: node scripts/ci-vitest.mjs report

      - name: Upload Vitest reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-reports
          path: |
            ${{ runner.temp }}/lcm-vitest-${{ github.run_id }}-${{ github.run_attempt }}/coverage/
            ${{ runner.temp }}/lcm-vitest-${{ github.run_id }}-${{ github.run_attempt }}/test-report.junit.xml
          if-no-files-found: warn

      - name: Check for workspace artifacts
        run: bash .github/scripts/check-workspace-clean.sh

  postgresql:
    name: PostgreSQL 18 conformance
    needs: plan
    if: ${{ needs.plan.outputs.postgresql == 'true' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node

      - name: Stage PostgreSQL harness
        uses: ./.github/actions/stage-postgresql

      - name: Run isolated PostgreSQL 18 conformance harness
        run: pnpm run test:postgresql

  linux-systemd:
    name: Linux Ubuntu 24.04 user-systemd integration
    needs: plan
    if: ${{ needs.plan.outputs.systemd == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node

      - name: Build package
        run: pnpm run build

      - name: Run real user-systemd integration
        env:
          LCM_SYSTEMD_CREDENTIAL_INTEGRATION: "1"
          LCM_LIFECYCLE_SYSTEMD_INTEGRATION: "1"
          LCM_LIFECYCLE_SCOPE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          LCM_LIFECYCLE_SYSTEMD_BARRIER_DIR: ${{ runner.temp }}/lcm-systemd-${{ github.run_id }}-${{ github.run_attempt }}
          LCM_LIFECYCLE_DAEMON_PORT: "48322"
          LCM_LIFECYCLE_EXPECTED_SCOPES: "1"
          LCM_RUNTIME_PATHS_SYSTEMD_INTEGRATION: "1"
          LCM_RUNTIME_PATHS_SYSTEMD_RUN_ROOT: ${{ runner.temp }}/lcm-runtime-paths-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/systemd-integration.sh

  macos-launchd:
    name: macOS 15 launchd feasibility
    needs: plan
    if: ${{ needs.plan.outputs.launchd == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node

      - name: Probe descriptor-relative runtime migration
        run: pnpm exec vitest run test/runtime-paths.test.ts --testNamePattern "uses actual platform semantics for nested legacy migration"

      - name: Run launchd integration path
        env:
          LCM_LAUNCHD_INTEGRATION: "1"
          LCM_LAUNCHD_SCOPE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          LCM_LAUNCHD_RESOURCE_ROOT: ${{ runner.temp }}/lcm-launchd-${{ github.run_id }}-${{ github.run_attempt }}
          LCM_LAUNCHD_LABEL: com.donadiosolutions.lcm.ci.${{ github.run_id }}.${{ github.run_attempt }}
        run: bash .github/scripts/launchd-integration.sh

  ci:
    name: ci
    needs:
      - plan
      - checks
      - unit
      - report
      - postgresql
      - linux-systemd
      - macos-launchd
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/ci-gate.mjs
          sparse-checkout-cone-mode: false

      - name: Require every planned CI job
        env:
          PLAN_UNIT: ${{ needs.plan.outputs.unit }}
          PLAN_POSTGRESQL: ${{ needs.plan.outputs.postgresql }}
          PLAN_SYSTEMD: ${{ needs.plan.outputs.systemd }}
          PLAN_LAUNCHD: ${{ needs.plan.outputs.launchd }}
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          REPORT_RESULT: ${{ needs.report.result }}
          POSTGRESQL_RESULT: ${{ needs.postgresql.result }}
          LINUX_SYSTEMD_RESULT: ${{ needs.linux-systemd.result }}
          MACOS_LAUNCHD_RESULT: ${{ needs.macos-launchd.result }}
        run: node .github/scripts/ci-gate.mjs

  codecov:
    name: Codecov upload
    needs:
      - plan
      - report
    if: ${{ !cancelled() && needs.plan.outputs.coverage == 'true' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # Download the fixed report artifact produced by this workflow run.
      actions: read
      # Make the artifact-producing tree available for Codecov path reconciliation.
      contents: read
      # Enable Codecov OIDC authentication without a repository secret.
      id-token: write
    steps:
      - name: Checkout source for Codecov
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Vitest reports
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$REPOSITORY" \
            --name vitest-reports \
            --dir .

      - name: Download verified Codecov CLI
        env:
          GH_TOKEN: ${{ github.token }}
          CODECOV_CLI_REPOSITORY: codecov/codecov-cli
          CODECOV_CLI_TAG: v11.2.6
          CODECOV_CLI_ASSET: codecovcli_linux
          CODECOV_CLI_SHA256: fd34214e2b2c738e48e3ac90b2c23ec4e975d0e9aee51f2cebe81b5704af3f6c
        run: |
          set -Eeuo pipefail
          CODECOV_CLI_PATH="$RUNNER_TEMP/codecov"
          gh release download "$CODECOV_CLI_TAG" \
            --repo "$CODECOV_CLI_REPOSITORY" \
            --pattern "$CODECOV_CLI_ASSET" \
            --output "$CODECOV_CLI_PATH"
          printf '%s  %s\n' "$CODECOV_CLI_SHA256" "$CODECOV_CLI_PATH" \
            | sha256sum --check --strict
          chmod 0755 "$CODECOV_CLI_PATH"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          binary: ${{ runner.temp }}/codecov
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: test-report.junit.xml
          disable_search: true
          report_type: test_results
          binary: ${{ runner.temp }}/codecov
          fail_ci_if_error: true
