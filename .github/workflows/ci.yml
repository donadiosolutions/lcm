name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:ci

      - name: Test issue label policy
        run: node --test .github/scripts/issue-label-policy.test.mjs

      - name: Upload Vitest reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-reports
          path: |
            coverage/
            test-report.junit.xml
          if-no-files-found: warn

      - name: Build
        run: npm run build

      - name: Verify committed plugin bundles
        run: |
          npm run check:plugin-bundles
          git diff --exit-code -- lcm.mjs mcp.mjs

      - name: Check for workspace artifacts
        run: |
          UNTRACKED=$(git status --porcelain | grep "^??" | grep -vE "^\?\? (node_modules|dist|coverage)/|^\?\? test-report\.junit\.xml$" || true)
          if [ -n "$UNTRACKED" ]; then
            echo "❌ Tests or build left unexpected untracked files in the workspace:"
            echo "$UNTRACKED"
            echo ""
            echo "Ensure all temp files go to os.tmpdir(), not process.cwd(). Tests must clean up after themselves."
            exit 1
          fi
          echo "✅ Workspace is clean"

  codecov:
    name: Codecov upload
    needs: ci
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      # Download the fixed report artifact produced by this workflow run.
      actions: read
      # Enable Codecov OIDC authentication without a repository secret.
      id-token: write
    steps:
      - name: Download Vitest reports
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$REPOSITORY" \
            --name vitest-reports \
            --dir .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          files: coverage/lcov.info
          disable_search: true
          version: v11.2.6
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          files: test-report.junit.xml
          disable_search: true
          report_type: test_results
          version: v11.2.6
          fail_ci_if_error: true

      - name: Clean Codecov uploader files
        if: ${{ !cancelled() }}
        run: rm -f codecov codecov.SHA256SUM codecov.SHA256SUM.sig
