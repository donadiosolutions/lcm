name: External admission merge group

on:
  merge_group:
    types:
      - checks_requested

permissions: {}

concurrency:
  group: external-admission-merge-group-${{ github.sha }}
  cancel-in-progress: true

jobs:
  external-admission:
    name: external-admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Accept previously admitted merge group
        run: |
          set -Eeuo pipefail

          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid merge-group SHA." >&2
            exit 1
          fi

          # Every PR was admitted only after both external providers succeeded
          # on its exact head SHA. They do not report on synthetic merge commits.
          echo "External providers passed before merge-queue admission."
