name: Stale issues
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stale-issues
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mark configured high-priority issues as temporarily exempt
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXEMPT_LABEL: internal-stale-priority-exempt
        with:
          github-token: ${{ secrets.CODEX_ISSUE_TRIAGE_WRITE_TOKEN }}
          script: |
            const { join } = await import("node:path");
            const { pathToFileURL } = await import("node:url");
            const policyUrl = pathToFileURL(
              join(process.env.GITHUB_WORKSPACE, ".github/scripts/issue-label-policy.mjs"),
            ).href;
            const { loadTriagePolicy } = await import(policyUrl);
            const policy = await loadTriagePolicy(
              join(
                process.env.GITHUB_WORKSPACE,
                ".github/codex/issue-triage-policy.json",
              ),
            );
            const priorityFieldName = policy.fields.priority.name;
            const staleExemptOptions = new Set(
              policy.fields.priority.staleExemptOptions,
            );
            const label = process.env.EXEMPT_LABEL;
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: label,
                  color: "EDEDED",
                  description: "Temporary internal marker for Planning Field-based stale exemption",
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }

            const exempt = [];
            const staleThreshold =
              Date.now() - (30 * 24 * 60 * 60 * 1_000);
            let cursor = null;
            let reachedRecentIssues = false;
            do {
              const response = await github.graphql(
                `query PriorityExemptIssues(
                  $owner: String!
                  $repo: String!
                  $cursor: String
                ) {
                  repository(owner: $owner, name: $repo) {
                    issues(
                      first: 100
                      after: $cursor
                      states: OPEN
                      orderBy: {field: UPDATED_AT, direction: ASC}
                    ) {
                      nodes {
                        id
                        number
                        updatedAt
                        issueFieldValues(first: 100) {
                          nodes {
                            ... on IssueFieldSingleSelectValue {
                              name
                              field {
                                ... on IssueFieldSingleSelect {
                                  name
                                }
                              }
                            }
                          }
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }`,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cursor,
                },
              );
              for (const issue of response.repository.issues.nodes) {
                const updatedAt = Date.parse(issue.updatedAt);
                if (!Number.isFinite(updatedAt)) {
                  throw new Error(
                    `Issue #${issue.number} has an invalid updatedAt timestamp`,
                  );
                }
                if (updatedAt > staleThreshold) {
                  reachedRecentIssues = true;
                  break;
                }
                const priorityValues = issue.issueFieldValues.nodes.filter(
                  (value) => value.field?.name === priorityFieldName,
                );
                let fieldPageInfo = issue.issueFieldValues.pageInfo;
                while (fieldPageInfo.hasNextPage) {
                  if (!fieldPageInfo.endCursor) {
                    throw new Error(
                      `Issue #${issue.number} has another Planning Field page without a cursor`,
                    );
                  }
                  const fieldResponse = await github.graphql(
                    `query PriorityExemptIssueFields(
                      $issueId: ID!
                      $cursor: String
                    ) {
                      node(id: $issueId) {
                        ... on Issue {
                          issueFieldValues(first: 100, after: $cursor) {
                            nodes {
                              ... on IssueFieldSingleSelectValue {
                                name
                                field {
                                  ... on IssueFieldSingleSelect {
                                    name
                                  }
                                }
                              }
                            }
                            pageInfo {
                              hasNextPage
                              endCursor
                            }
                          }
                        }
                      }
                    }`,
                    {
                      issueId: issue.id,
                      cursor: fieldPageInfo.endCursor,
                    },
                  );
                  const fieldPage = fieldResponse.node?.issueFieldValues;
                  if (!fieldPage) {
                    throw new Error(
                      `Could not read Planning Fields for issue #${issue.number}`,
                    );
                  }
                  priorityValues.push(
                    ...fieldPage.nodes.filter(
                      (value) => value.field?.name === priorityFieldName,
                    ),
                  );
                  fieldPageInfo = fieldPage.pageInfo;
                }
                if (priorityValues.length > 1) {
                  throw new Error(
                    `Issue #${issue.number} has duplicate `
                    + `${priorityFieldName} Planning Field values`,
                  );
                }
                const priority = priorityValues[0]?.name;
                if (staleExemptOptions.has(priority)) {
                  exempt.push(issue.number);
                }
              }
              const pageInfo = response.repository.issues.pageInfo;
              if (reachedRecentIssues || !pageInfo.hasNextPage) {
                cursor = null;
              } else if (!pageInfo.endCursor) {
                throw new Error("Open issue pagination has no end cursor");
              } else {
                cursor = pageInfo.endCursor;
              }
            } while (cursor !== null);
            for (const issueNumber of exempt) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issueNumber,
                labels: [label],
              });
            }
            core.info(`Temporarily exempted ${exempt.length} high-priority issue(s).`);

      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          repo-token: ${{ secrets.CODEX_ISSUE_TRIAGE_WRITE_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            activity in the last 30 days. It will be closed in 14 days if no further
            activity occurs. Remove the stale label or comment to keep it open.
          days-before-stale: 30
          days-before-close: 14
          exempt-issue-labels: 'blocked,internal-stale-priority-exempt'
          stale-issue-label: 'stale'

      - name: Remove temporary Priority exemption markers
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXEMPT_LABEL: internal-stale-priority-exempt
        with:
          github-token: ${{ secrets.CODEX_ISSUE_TRIAGE_WRITE_TOKEN }}
          script: |
            const failures = [];
            const markedIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                ...context.repo,
                state: "all",
                labels: process.env.EXEMPT_LABEL,
                per_page: 100,
              },
            );
            for (const issue of markedIssues) {
              if (issue.pull_request) continue;
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issue.number,
                  name: process.env.EXEMPT_LABEL,
                });
              } catch (error) {
                if (error.status !== 404) {
                  failures.push(`#${issue.number}: ${error.message}`);
                }
              }
            }
            try {
              await github.rest.issues.deleteLabel({
                ...context.repo,
                name: process.env.EXEMPT_LABEL,
              });
            } catch (error) {
              if (error.status !== 404) {
                failures.push(`label deletion: ${error.message}`);
              }
            }
            if (failures.length > 0) {
              core.setFailed(`Failed to remove stale exemption markers: ${failures.join("; ")}`);
            }
