name: Update Gitleaks Patterns

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  update-patterns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require pattern bot token
        env:
          PATTERNS_BOT_TOKEN: ${{ secrets.PATTERNS_BOT_TOKEN }}
        run: |
          if [[ -z "$PATTERNS_BOT_TOKEN" ]]; then
            echo "::error::PATTERNS_BOT_TOKEN is required so generated PRs trigger normal pull_request checks."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"

      - name: Bootstrap verified pnpm
        shell: bash
        run: |
          set -Eeuo pipefail
          bootstrap_root="$(mktemp -d "$RUNNER_TEMP/lcm-pnpm.XXXXXX")"
          pnpm_bin="$(node scripts/bootstrap-pnpm.mjs --destination "$bootstrap_root/pnpm")"
          printf '%s\n' "$pnpm_bin" >> "$GITHUB_PATH"
          printf 'npm_config_store_dir=%s\n' "$RUNNER_TEMP/lcm-pnpm-store" >> "$GITHUB_ENV"

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: |
          set -Eeuo pipefail
          store_path="$(pnpm store path)"
          printf 'path=%s\n' "$store_path" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-node-22.20.0-${{ hashFiles('package.json', 'pnpm-lock.yaml', '.npmrc', 'pnpm-workspace.yaml', 'scripts/bootstrap-pnpm.mjs') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run update-gitleaks-patterns
        run: pnpm run update:patterns

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet --ignore-matching-lines='^// Updated:' -- src/generated-patterns.ts; then
            git restore src/generated-patterns.ts
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to generated-patterns.ts — skipping commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Extract new rule count from updated file
            count=$(sed -n 's/^\/\/ Rules: \([0-9][0-9]*\).*/\1/p' src/generated-patterns.ts | head -n 1)
            if [[ -z "$count" ]]; then
              echo "::error::Failed to extract numeric rule count from src/generated-patterns.ts"
              exit 1
            fi
            echo "rule_count=$count" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate rule count
        if: steps.diff.outputs.changed == 'true'
        run: |
          RULE_COUNT="${{ steps.diff.outputs.rule_count }}"
          if [[ ! "$RULE_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::Rule count must be numeric before it is used in branch or file names."
            exit 1
          fi

      - name: Write changeset
        if: steps.diff.outputs.changed == 'true'
        run: |
          RULE_COUNT="${{ steps.diff.outputs.rule_count }}"
          mkdir -p .changeset
          cat > ".changeset/gitleaks-patterns-${RULE_COUNT}.md" <<EOF
          ---
          "@donadiosolutions/lcm": patch
          ---

          Update generated gitleaks redaction patterns to ${RULE_COUNT} rules.
          EOF

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PATTERNS_BOT_TOKEN }}
          GH_PROMPT_DISABLED: "1"
        run: |
          RULE_COUNT="${{ steps.diff.outputs.rule_count }}"
          BRANCH="chore/update-gitleaks-patterns-${RULE_COUNT}-rules"
          CHANGESET=".changeset/gitleaks-patterns-${RULE_COUNT}.md"
          git config user.name "gitleaks-patterns-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote --exit-code --refs origin "refs/heads/$BRANCH" >/dev/null
          branch_status=$?
          set -e
          if [[ "$branch_status" -eq 0 ]]; then
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          elif [[ "$branch_status" -eq 2 ]]; then
            echo "No existing remote branch found; push will create $BRANCH."
          else
            echo "::error::Existing branch discovery failed with status $branch_status"
            exit 1
          fi

          GENERATED_COPY="$RUNNER_TEMP/generated-patterns.ts"
          cp src/generated-patterns.ts "$GENERATED_COPY"
          git restore src/generated-patterns.ts
          git checkout -B "$BRANCH" origin/main
          cp "$GENERATED_COPY" src/generated-patterns.ts
          UNEXPECTED=$(git status --short | awk '!/^( M src\/generated-patterns\.ts|\?\? \.changeset\/gitleaks-patterns-[0-9]+\.md)$/')
          if [[ -n "$UNEXPECTED" ]]; then
            echo "::error::Pattern update produced changes outside the allowlist"
            printf '%s\n' "$UNEXPECTED"
            exit 1
          fi

          git add src/generated-patterns.ts "$CHANGESET"
          git commit -s -m "chore(security): sync gitleaks patterns → ${RULE_COUNT} rules"
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push -u origin "$BRANCH" --force-with-lease

          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -z "$PR_NUMBER" ]]; then
            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "$BRANCH" \
              --title "chore(security): sync gitleaks patterns" \
              --body "Updates generated gitleaks patterns to ${RULE_COUNT} rules and adds a patch changeset so the normal version PR owns release metadata.")
            PR_NUMBER="${PR_URL##*/}"
          fi

          if [[ -z "$PR_NUMBER" || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse PR number (got: '$PR_NUMBER')" >&2
            exit 1
          fi

      - name: Summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          RULE_COUNT="${{ steps.diff.outputs.rule_count }}"
          {
            echo "### Gitleaks Patterns Updated"
            echo ""
            echo "- **Rules:** ${RULE_COUNT}"
            echo "- **Branch:** chore/update-gitleaks-patterns-${RULE_COUNT}-rules"
            echo ""
            echo "> **Manual step required:** Review and merge the generated PR to main when ready."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No-op summary
        if: steps.diff.outputs.changed == 'false'
        run: |
          {
            echo "### No Gitleaks Pattern Changes"
            echo ""
            echo "Gitleaks patterns are up to date — no commit needed."
          } >> "$GITHUB_STEP_SUMMARY"
