name: Update Gitleaks Patterns

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  update-patterns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          token: ${{ secrets.PATTERNS_BOT_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require pattern bot token
        env:
          PATTERNS_BOT_TOKEN: ${{ secrets.PATTERNS_BOT_TOKEN }}
        run: |
          if [[ -z "$PATTERNS_BOT_TOKEN" ]]; then
            echo "::error::PATTERNS_BOT_TOKEN is required so generated PRs trigger normal pull_request checks."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run update-gitleaks-patterns
        run: npx tsx scripts/update-gitleaks-patterns.ts

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/generated-patterns.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to generated-patterns.ts — skipping commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Extract new rule count from updated file
            count=$(sed -n 's/^\/\/ Rules: \([0-9][0-9]*\).*/\1/p' src/generated-patterns.ts | head -n 1)
            if [[ -z "$count" ]]; then
              echo "::error::Failed to extract numeric rule count from src/generated-patterns.ts"
              exit 1
            fi
            echo "rule_count=$count" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate rule count
        if: steps.diff.outputs.changed == 'true'
        run: |
          RULE_COUNT="${{ steps.diff.outputs.rule_count }}"
          if [[ ! "$RULE_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::Rule count must be numeric before it is used in branch or file names."
            exit 1
          fi

      - name: Write changeset
        if: steps.diff.outputs.changed == 'true'
        run: |
          RULE_COUNT="${{ steps.diff.outputs.rule_count }}"
          mkdir -p .changeset
          cat > ".changeset/gitleaks-patterns-${RULE_COUNT}.md" <<EOF
          ---
          "@donadiosolutions/lcm": patch
          ---

          Update generated gitleaks redaction patterns to ${RULE_COUNT} rules.
          EOF

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PATTERNS_BOT_TOKEN }}
        run: |
          RULE_COUNT="${{ steps.diff.outputs.rule_count }}"
          BRANCH="chore/update-gitleaks-patterns-${RULE_COUNT}-rules"
          CHANGESET=".changeset/gitleaks-patterns-${RULE_COUNT}.md"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "gitleaks-patterns-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true

          if git rev-parse --verify "refs/remotes/origin/$BRANCH" >/dev/null 2>&1 &&
             git diff --quiet "origin/$BRANCH" -- src/generated-patterns.ts "$CHANGESET"; then
            echo "Existing branch $BRANCH already contains the generated pattern update."
          else
            git checkout -B "$BRANCH"
            git add src/generated-patterns.ts "$CHANGESET"
            git commit -s -m "chore(security): sync gitleaks patterns → ${RULE_COUNT} rules"
            git push -u origin "$BRANCH" --force-with-lease
          fi

          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -z "$PR_NUMBER" ]]; then
            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "$BRANCH" \
              --title "chore(security): sync gitleaks patterns" \
              --body "Updates generated gitleaks patterns to ${RULE_COUNT} rules and adds a patch changeset so the normal version PR owns release metadata.")
            PR_NUMBER="${PR_URL##*/}"
          fi

          if [[ -z "$PR_NUMBER" || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse PR number (got: '$PR_NUMBER')" >&2
            exit 1
          fi

      - name: Summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          RULE_COUNT="${{ steps.diff.outputs.rule_count }}"
          echo "### Gitleaks Patterns Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Rules:** ${RULE_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** chore/update-gitleaks-patterns-${RULE_COUNT}-rules" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **Manual step required:** Review and merge the generated PR to main when ready." >> "$GITHUB_STEP_SUMMARY"

      - name: No-op summary
        if: steps.diff.outputs.changed == 'false'
        run: |
          echo "### No Gitleaks Pattern Changes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gitleaks patterns are up to date — no commit needed." >> "$GITHUB_STEP_SUMMARY"
