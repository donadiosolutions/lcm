name: Update Gitleaks Patterns

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-patterns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          token: ${{ secrets.PATTERNS_BOT_TOKEN || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run update-gitleaks-patterns
        run: npx tsx scripts/update-gitleaks-patterns.ts

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/generated-patterns.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to generated-patterns.ts — skipping commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Extract new rule count from updated file
            count=$(grep -oP '(?<=// Rules: )\d+' src/generated-patterns.ts || echo "?")
            echo "rule_count=$count" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.diff.outputs.changed == 'true'
        id: bump
        run: |
          # Read current version and bump patch
          current=$(node -p "require('./package.json').version")
          # Increment patch: 0.7.0 -> 0.7.1
          IFS='.' read -r major minor patch <<< "$current"
          new_patch=$((patch + 1))
          new_version="$major.$minor.$new_patch"
          # Update package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.version = '$new_version';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "Bumped version: $current -> $new_version"

      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PATTERNS_BOT_TOKEN || github.token }}
        run: |
          BRANCH="chore/update-gitleaks-patterns-v${{ steps.bump.outputs.new_version }}"
          git config user.name "gitleaks-patterns-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git checkout -B "$BRANCH"
          git add src/generated-patterns.ts package.json
          git commit -s -m "chore(security): sync gitleaks patterns → ${{ steps.diff.outputs.rule_count }} rules (v${{ steps.bump.outputs.new_version }})"
          git push -u origin "$BRANCH" --force-with-lease

          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -z "$PR_NUMBER" ]]; then
            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "$BRANCH" \
              --title "chore(security): sync gitleaks patterns" \
              --body "Updates generated gitleaks patterns to ${{ steps.diff.outputs.rule_count }} rules and bumps the package patch version to v${{ steps.bump.outputs.new_version }}.")
            PR_NUMBER="${PR_URL##*/}"
          fi

          if [[ -z "$PR_NUMBER" || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse PR number (got: '$PR_NUMBER')" >&2
            exit 1
          fi

      - name: Summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "### Gitleaks Patterns Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Rules:** ${{ steps.diff.outputs.rule_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** v${{ steps.bump.outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** chore/update-gitleaks-patterns-v${{ steps.bump.outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **Manual step required:** Review and merge the generated PR to main when ready." >> "$GITHUB_STEP_SUMMARY"

      - name: No-op summary
        if: steps.diff.outputs.changed == 'false'
        run: |
          echo "### No Gitleaks Pattern Changes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gitleaks patterns are up to date — no commit needed." >> "$GITHUB_STEP_SUMMARY"
