name: Publish Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: Semver tag to publish, for example v1.2.3. Leave blank to use the selected ref.
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Check release tag and package version
        id: check
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          tag="${REQUESTED_REF#refs/tags/}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ref '$REQUESTED_REF' is not an exact release tag like v1.2.3 — skipping publish"
            printf 'valid_release=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_version="${tag#v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "::error::package.json version $version does not match release tag $tag"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::release tag $tag must point to a commit reachable from origin/main"
            exit 1
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'valid_release=true\n'
          } >> "$GITHUB_OUTPUT"

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Package $name@$version already published to npm — skipping npm publish"
            printf 'publish_package=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'publish_package=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify trusted publishing prerequisites
        if: steps.check.outputs.valid_release == 'true'
        run: |
          node --version
          npm --version
          node - <<'NODE'
          const cp = require('node:child_process');

          function assertAtLeast(label, actual, expected) {
            const actualParts = actual.replace(/^v/, '').split('.').map(Number);
            const expectedParts = expected.split('.').map(Number);
            for (let i = 0; i < expectedParts.length; i += 1) {
              if (actualParts[i] > expectedParts[i]) return;
              if (actualParts[i] < expectedParts[i]) {
                throw new Error(`${label} ${actual} is below required ${expected}`);
              }
            }
          }

          assertAtLeast('Node', process.version, '22.14.0');
          assertAtLeast('npm', cp.execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(), '11.5.1');
          NODE

      - name: Prepare GitHub release notes
        if: steps.check.outputs.valid_release == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          # Get the top version block from CHANGELOG.md. Changesets may write
          # headings as either "## 1.2.3" or "## [1.2.3]".
          CHANGELOG_BLOCK=$(awk -v version="$VERSION" '
            $0 == "## " version || $0 == "## [" version "]" ||
            index($0, "## " version " ") == 1 || index($0, "## [" version "] ") == 1 {
              found=1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "$(printf '%s' "$CHANGELOG_BLOCK" | tr -d '[:space:]')" ]]; then
            echo "::error::No changelog block found for version $VERSION in CHANGELOG.md"
            exit 1
          fi
          # Build enriched notes before publishing so release-note failures stop the package publish.
          NPM_BADGE="📦 **npm:** \`npm install @donadiosolutions/lcm@${VERSION}\`"
          {
            printf '%s\n\n' "$NPM_BADGE"
            printf '%s\n\n' '---'
            printf '%s\n\n' '## Changelog'
            printf '%s\n\n' "$CHANGELOG_BLOCK"
            printf '%s\n\n' '---'
            printf '%s\n' '🔖 [Full Changelog](https://github.com/donadiosolutions/lcm/blob/main/CHANGELOG.md)'
          } > release-notes.md

      - name: Install dependencies
        if: steps.check.outputs.valid_release == 'true'
        run: npm ci

      - name: Type-check
        if: steps.check.outputs.valid_release == 'true'
        run: npm run typecheck

      - name: Run tests
        if: steps.check.outputs.valid_release == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.valid_release == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.valid_release == 'true' && steps.check.outputs.publish_package == 'true'
        run: npm publish --access public

      - name: Create or update GitHub release
        if: steps.check.outputs.valid_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
