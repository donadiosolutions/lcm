name: Publish Package
run-name: release-tag:${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable published release tag to recover, for example v1.4.2
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-package
  # Current GitHub syntax: preserve up to 100 pending runs FIFO; installed actionlint lags.
  queue: max

jobs:
  draft:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify signed annotated release tag
        id: tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-beta\.(0|[1-9]\d*))?$/.exec(tag);
            if (!match) throw new Error(`Unsupported release tag ${tag}`);
            const expectedRef = `refs/tags/${tag}`;
            const { data: ref } = await github.rest.git.getRef({
              ...context.repo,
              ref: `tags/${tag}`,
            });
            if (ref.ref !== expectedRef || ref.object.type !== "tag") {
              throw new Error(`Release ref ${expectedRef} must be an annotated tag object`);
            }
            const { data: annotatedTag } = await github.rest.git.getTag({
              ...context.repo,
              tag_sha: ref.object.sha,
            });
            if (
              annotatedTag.tag !== tag ||
              annotatedTag.object.type !== "commit" ||
              annotatedTag.verification?.verified !== true
            ) {
              throw new Error(`Release tag ${tag} failed identity, target, or signature verification`);
            }
            core.setOutput("commit", annotatedTag.object.sha);

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          tag="$RELEASE_TAG"
          version="$(node -p "require('./package.json').version")"

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Unsupported release tag '$tag'; expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N"
            exit 1
          fi
          if [[ "$version" != "${tag#v}" ]]; then
            echo "::error::package.json version $version does not match release tag $tag"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::release tag $tag must point to a commit reachable from origin/main"
            exit 1
          fi

          changelog_block="$(awk -v version="$version" '
            $0 == "## " version || $0 == "## [" version "]" ||
            index($0, "## " version " ") == 1 || index($0, "## [" version "] ") == 1 {
              found=1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [[ -z "$(printf '%s' "$changelog_block" | tr -d '[:space:]')" ]]; then
            echo "::error::No changelog block found for version $version in CHANGELOG.md"
            exit 1
          fi

          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            if [[ "$version" == *-beta.* ]]; then
              printf 'is_beta=true\n'
            else
              printf 'is_beta=false\n'
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Set up verified Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Check npm release ordering
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node .github/scripts/check-npm-release-state.mjs "$RELEASE_VERSION"

      - name: Type-check
        run: npm run typecheck

      - name: Run complete coverage suite
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Verify build leaves tracked sources unchanged
        run: git diff --exit-code

      - name: Collect release pull requests
        id: notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const { spawnSync } = await import("node:child_process");
            const { writeFileSync } = await import("node:fs");
            const { join } = await import("node:path");
            const { pathToFileURL } = await import("node:url");
            const policyUrl = pathToFileURL(
              join(process.env.GITHUB_WORKSPACE, ".github/scripts/release-policy.mjs"),
            ).href;
            const {
              buildHighlightsPrompt,
              categorizeReleasePullRequests,
              collectReleasePullRequests,
              parseReleaseTag,
              selectPreviousRelease,
            } = await import(policyUrl);

            const targetTag = process.env.RELEASE_TAG;
            parseReleaseTag(targetTag);
            const targetRef = "HEAD";
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { ...context.repo, per_page: 100 },
            );
            const ancestorTags = new Set();
            for (const release of releases) {
              if (release.draft || !release.published_at || release.tag_name === targetTag) continue;
              try {
                parseReleaseTag(release.tag_name);
              } catch {
                continue;
              }
              const tagRef = `refs/tags/${release.tag_name}`;
              const fetchResult = spawnSync(
                "git",
                ["fetch", "--no-tags", "origin", `${tagRef}:${tagRef}`],
                { encoding: "utf8" },
              );
              if (fetchResult.error) throw fetchResult.error;
              if (fetchResult.status !== 0) {
                throw new Error(
                  `Unable to fetch published release tag ${release.tag_name}: ${fetchResult.stderr.trim()}`,
                );
              }
              const result = spawnSync(
                "git",
                ["merge-base", "--is-ancestor", tagRef, targetRef],
                { stdio: "ignore" },
              );
              if (result.error) throw result.error;
              if (result.status === 0) ancestorTags.add(release.tag_name);
              else if (result.status !== 1) {
                throw new Error(
                  `Unable to compare release tag ${release.tag_name} with ${targetTag}`,
                );
              }
            }

            const previous = selectPreviousRelease(targetTag, releases, { ancestorTags });
            const entries = await collectReleasePullRequests({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              baseTag: previous.tag_name,
              targetTag,
              cwd: process.env.GITHUB_WORKSPACE,
            });
            const categorized = categorizeReleasePullRequests(entries);
            const prompt = buildHighlightsPrompt({
              targetTag,
              baseTag: previous.tag_name,
              categorized,
            });
            writeFileSync("release-highlights-prompt.md", prompt, "utf8");
            writeFileSync(
              "release-data.json",
              JSON.stringify({ targetTag, baseTag: previous.tag_name, categorized }),
              "utf8",
            );
            core.setOutput("base_tag", previous.tag_name);
            core.info(`Prepared release notes for ${previous.tag_name}..${targetTag}`);

      - name: Generate Highlights with Codex
        id: highlights
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.10
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: release-highlights-prompt.md
          output-schema-file: .github/codex/release-highlights.schema.json
          codex-version: 0.144.6
          model: gpt-5.6-terra
          effort: high
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

      - name: Create or update draft GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HIGHLIGHTS_RESULT: ${{ steps.highlights.outputs.final-message }}
          IS_BETA: ${{ steps.release.outputs.is_beta }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const { readFileSync } = await import("node:fs");
            const { join } = await import("node:path");
            const { pathToFileURL } = await import("node:url");
            const policyUrl = pathToFileURL(
              join(process.env.GITHUB_WORKSPACE, ".github/scripts/release-policy.mjs"),
            ).href;
            const { parseHighlightsResult, renderReleaseNotes } = await import(policyUrl);

            const releaseData = JSON.parse(readFileSync("release-data.json", "utf8"));
            const highlights = parseHighlightsResult(process.env.HIGHLIGHTS_RESULT);
            const tag_name = process.env.RELEASE_TAG;
            const body = renderReleaseNotes({
              targetTag: tag_name,
              highlights,
              categorized: releaseData.categorized,
            });
            const prerelease = process.env.IS_BETA === "true";

            let existing;
            try {
              ({ data: existing } = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: tag_name,
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existing) {
              if (!existing.draft) {
                throw new Error(`Refusing to replace published release ${tag_name}`);
              }
              await github.rest.repos.updateRelease({
                ...context.repo,
                release_id: existing.id,
                name: tag_name,
                body,
                draft: true,
                prerelease,
              });
              core.info(`Updated draft release ${tag_name}`);
            } else {
              await github.rest.repos.createRelease({
                ...context.repo,
                tag_name,
                name: tag_name,
                body,
                draft: true,
                prerelease,
              });
              core.info(`Created draft release ${tag_name}`);
            }

  preflight:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      commit: ${{ steps.tag.outputs.commit }}
      is_beta: ${{ steps.release.outputs.is_beta }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout trusted default-branch release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Validate trusted release provenance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        with:
          script: |
            const { join } = await import("node:path");
            const { pathToFileURL } = await import("node:url");
            const policyUrl = pathToFileURL(
              join(
                process.env.GITHUB_WORKSPACE,
                "trusted",
                ".github/scripts/release-policy.mjs",
              ),
            ).href;
            const {
              assertActionCreatedReleaseBody,
              enforceEarlierPublicationSuccess,
              parseReleaseTag,
            } = await import(policyUrl);

            const currentRunId = Number(context.runId);
            const currentTag = process.env.RELEASE_TAG;
            parseReleaseTag(currentTag);
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: currentTag,
            });
            if (release.id !== context.payload.release.id || release.draft) {
              throw new Error(`Release ${currentTag} is not the currently published event release`);
            }
            assertActionCreatedReleaseBody(release.body, currentTag);
            await enforceEarlierPublicationSuccess({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              currentRunId,
              currentTag,
              warning: (message) => core.warning(message),
            });

      - name: Verify signed annotated release tag
        id: tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-beta\.(0|[1-9]\d*))?$/.exec(tag);
            if (!match) throw new Error(`Unsupported release tag ${tag}`);
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag,
            });
            if (release.id !== context.payload.release.id || release.draft) {
              throw new Error(`Release ${tag} is not the currently published event release`);
            }
            const expectedRef = `refs/tags/${tag}`;
            const { data: ref } = await github.rest.git.getRef({
              ...context.repo,
              ref: `tags/${tag}`,
            });
            if (ref.ref !== expectedRef || ref.object.type !== "tag") {
              throw new Error(`Release ref ${expectedRef} must be an annotated tag object`);
            }
            const { data: annotatedTag } = await github.rest.git.getTag({
              ...context.repo,
              tag_sha: ref.object.sha,
            });
            if (
              annotatedTag.tag !== tag ||
              annotatedTag.object.type !== "commit" ||
              annotatedTag.verification?.verified !== true
            ) {
              throw new Error(`Release tag ${tag} failed identity, target, or signature verification`);
            }
            core.setOutput("commit", annotatedTag.object.sha);
            core.setOutput("tag", tag);
            core.setOutput("version", tag.slice(1));
            core.setOutput("is_beta", tag.includes("-beta."));

      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Check npm release ordering
        id: npm
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: node ../trusted/.github/scripts/check-npm-release-state.mjs "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate published release
        id: release
        env:
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          tag="$RELEASE_TAG"
          version="$(node -p "require('./package.json').version")"

          if [[ "$RELEASE_DRAFT" != "false" ]]; then
            echo "::error::release published event unexpectedly refers to a draft"
            exit 1
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Unsupported release tag '$tag'"
            exit 1
          fi
          if [[ "$version" != "${tag#v}" ]]; then
            echo "::error::package.json version $version does not match release tag $tag"
            exit 1
          fi

          is_beta=false
          [[ "$version" == *-beta.* ]] && is_beta=true
          if [[ "$RELEASE_PRERELEASE" != "$is_beta" ]]; then
            echo "::error::GitHub prerelease flag $RELEASE_PRERELEASE does not match $tag"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::release tag $tag must point to a commit reachable from origin/main"
            exit 1
          fi

          changelog_block="$(awk -v version="$version" '
            $0 == "## " version || $0 == "## [" version "]" ||
            index($0, "## " version " ") == 1 || index($0, "## [" version "] ") == 1 {
              found=1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [[ -z "$(printf '%s' "$changelog_block" | tr -d '[:space:]')" ]]; then
            echo "::error::No changelog block found for version $version in CHANGELOG.md"
            exit 1
          fi

          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'is_beta=%s\n' "$is_beta"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Set up verified Rust toolchain
        uses: ./release/.github/actions/setup-rust-toolchain

      - name: Verify trusted publishing prerequisites
        run: |
          node --version
          npm --version
          node - <<'NODE'
          const cp = require('node:child_process');

          function assertAtLeast(label, actual, expected) {
            const actualParts = actual.replace(/^v/, '').split('.').map(Number);
            const expectedParts = expected.split('.').map(Number);
            for (let i = 0; i < expectedParts.length; i += 1) {
              if (actualParts[i] > expectedParts[i]) return;
              if (actualParts[i] < expectedParts[i]) {
                throw new Error(`${label} ${actual} is below required ${expected}`);
              }
            }
          }

          assertAtLeast('Node', process.version, '22.14.0');
          assertAtLeast('npm', cp.execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(), '11.5.1');
          NODE

      - name: Type-check
        run: npm run typecheck

      - name: Run complete coverage suite
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Verify build leaves tracked sources unchanged
        run: git diff --exit-code

      - name: Pack verified npm artifact
        run: |
          mkdir -p release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact

      - name: Name verified npm artifact
        id: artifact
        run: printf 'name=npm-package-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload verified npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release/release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    if: ${{ github.event_name == 'release' }}
    needs: preflight
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      guard_failed: ${{ steps.guard_state.outputs.failed }}
    steps:
      - name: Checkout trusted release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Download verified npm artifact
        env:
          ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir release-artifact

      - name: Revalidate signed release tag
        id: tag_guard
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const expectedCommit = process.env.EXPECTED_COMMIT;
            if (!/^[0-9a-f]{40}$/.test(expectedCommit)) throw new Error("Invalid expected commit");
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag,
            });
            if (release.id !== context.payload.release.id || release.draft) {
              throw new Error(`Release ${tag} is not the currently published event release`);
            }
            const { data: ref } = await github.rest.git.getRef({
              ...context.repo,
              ref: `tags/${tag}`,
            });
            if (ref.ref !== `refs/tags/${tag}` || ref.object.type !== "tag") {
              throw new Error(`Release ref refs/tags/${tag} is no longer annotated`);
            }
            const { data: annotatedTag } = await github.rest.git.getTag({
              ...context.repo,
              tag_sha: ref.object.sha,
            });
            if (
              annotatedTag.tag !== tag ||
              annotatedTag.object.type !== "commit" ||
              annotatedTag.object.sha !== expectedCommit ||
              annotatedTag.verification?.verified !== true
            ) {
              throw new Error(`Release tag ${tag} changed or failed signature verification`);
            }

      - name: Recheck npm release ordering
        id: npm_guard
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node trusted/.github/scripts/check-npm-release-state.mjs "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Record publication guard state
        id: guard_state
        if: ${{ always() }}
        env:
          FAILED: ${{ steps.tag_guard.outcome != 'success' || steps.npm_guard.outcome != 'success' }}
        run: printf 'failed=%s\n' "$FAILED" >> "$GITHUB_OUTPUT"

      - name: Fail closed when publication guards fail
        if: ${{ steps.guard_state.outputs.failed == 'true' }}
        run: |
          echo "::error::Release tag or npm ordering changed after preflight; restoring the GitHub release to draft"
          exit 1

      - name: Publish to npm
        if: ${{ steps.npm_guard.outputs.already_published != 'true' }}
        env:
          IS_BETA: ${{ needs.preflight.outputs.is_beta }}
        run: |
          set -Eeuo pipefail
          if [[ "$IS_BETA" == "true" ]]; then
            tag=beta
          else
            tag=latest
          fi
          node trusted/.github/scripts/publish-npm-tarball.mjs release-artifact "$tag"

      - name: Verify npm package and dist-tags
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node trusted/.github/scripts/verify-npm-release.mjs "$RELEASE_VERSION"

  recover-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      already_published: ${{ steps.npm.outputs.already_published }}
      artifact_name: ${{ steps.artifact.outputs.name }}
      commit: ${{ steps.tag.outputs.commit }}
      is_beta: ${{ steps.tag.outputs.is_beta }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    defaults:
      run:
        working-directory: release
    steps:
      - name: Checkout trusted default-branch recovery policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Verify recovery request and immutable release tag
        id: tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const { join } = await import("node:path");
            const { pathToFileURL } = await import("node:url");
            const policyUrl = pathToFileURL(
              join(
                process.env.GITHUB_WORKSPACE,
                "trusted",
                ".github/scripts/release-policy.mjs",
              ),
            ).href;
            const {
              assertActionCreatedReleaseBody,
              enforceEarlierPublicationSuccess,
              parseReleaseTag,
            } = await import(policyUrl);

            const tag = process.env.RELEASE_TAG;
            parseReleaseTag(tag);

            const { data: repository } = await github.rest.repos.get(context.repo);
            if (context.ref !== `refs/heads/${repository.default_branch}`) {
              throw new Error(`Recovery must run from protected ${repository.default_branch}`);
            }

            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag,
            });
            if (release.draft || !release.published_at) {
              throw new Error(`Recovery requires an already-published GitHub release for ${tag}`);
            }
            const expectedPrerelease = tag.includes("-beta.");
            if (release.prerelease !== expectedPrerelease) {
              throw new Error(`Release prerelease state does not match ${tag}`);
            }
            assertActionCreatedReleaseBody(release.body, tag);

            const { data: ref } = await github.rest.git.getRef({
              ...context.repo,
              ref: `tags/${tag}`,
            });
            if (ref.ref !== `refs/tags/${tag}` || ref.object.type !== "tag") {
              throw new Error(`Release ref refs/tags/${tag} must be an annotated tag object`);
            }
            const { data: annotatedTag } = await github.rest.git.getTag({
              ...context.repo,
              tag_sha: ref.object.sha,
            });
            if (
              annotatedTag.tag !== tag ||
              annotatedTag.object.type !== "commit" ||
              annotatedTag.verification?.verified !== true
            ) {
              throw new Error(`Release tag ${tag} failed identity, target, or signature verification`);
            }
            await enforceEarlierPublicationSuccess({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              currentRunId: Number(context.runId),
              currentTag: tag,
              warning: (message) => core.warning(message),
            });
            core.setOutput("commit", annotatedTag.object.sha);
            core.setOutput("is_beta", String(expectedPrerelease));
            core.setOutput("tag", tag);
            core.setOutput("version", tag.slice(1));

      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Check npm release ordering
        id: npm
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: node ../trusted/.github/scripts/check-npm-release-state.mjs "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tagged package
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::package.json version $version does not match release tag $RELEASE_TAG"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::release tag $RELEASE_TAG must be reachable from origin/main"
            exit 1
          fi
          changelog_block="$(awk -v version="$version" '
            $0 == "## " version || $0 == "## [" version "]" ||
            index($0, "## " version " ") == 1 || index($0, "## [" version "] ") == 1 {
              found=1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [[ -z "$(printf '%s' "$changelog_block" | tr -d '[:space:]')" ]]; then
            echo "::error::No changelog block found for version $version"
            exit 1
          fi

      - name: Install dependencies
        if: ${{ steps.npm.outputs.already_published != 'true' }}
        run: npm ci

      - name: Set up verified Rust toolchain
        if: ${{ steps.npm.outputs.already_published != 'true' }}
        uses: ./release/.github/actions/setup-rust-toolchain

      - name: Verify trusted publishing prerequisites
        if: ${{ steps.npm.outputs.already_published != 'true' }}
        run: |
          node --version
          npm --version
          node - <<'NODE'
          const cp = require('node:child_process');
          function assertAtLeast(label, actual, expected) {
            const actualParts = actual.replace(/^v/, '').split('.').map(Number);
            const expectedParts = expected.split('.').map(Number);
            for (let i = 0; i < expectedParts.length; i += 1) {
              if (actualParts[i] > expectedParts[i]) return;
              if (actualParts[i] < expectedParts[i]) {
                throw new Error(`${label} ${actual} is below required ${expected}`);
              }
            }
          }
          assertAtLeast('Node', process.version, '22.14.0');
          assertAtLeast('npm', cp.execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(), '11.5.1');
          NODE

      - name: Type-check
        if: ${{ steps.npm.outputs.already_published != 'true' }}
        run: npm run typecheck

      - name: Run complete coverage suite
        if: ${{ steps.npm.outputs.already_published != 'true' }}
        run: npm run test:ci

      - name: Build
        if: ${{ steps.npm.outputs.already_published != 'true' }}
        run: npm run build

      - name: Verify build leaves tracked sources unchanged
        if: ${{ steps.npm.outputs.already_published != 'true' }}
        run: git diff --exit-code

      - name: Pack verified npm artifact
        if: ${{ steps.npm.outputs.already_published != 'true' }}
        run: |
          mkdir -p release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact

      - name: Name verified npm artifact
        id: artifact
        if: ${{ steps.npm.outputs.already_published != 'true' }}
        run: printf 'name=npm-recovery-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload verified npm artifact
        if: ${{ steps.npm.outputs.already_published != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release/release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Verify existing npm package and dist-tags
        if: ${{ steps.npm.outputs.already_published == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: node ../trusted/.github/scripts/verify-npm-release.mjs "$RELEASE_VERSION"

  recover-publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: recover-preflight
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted recovery tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Revalidate signed release tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_COMMIT: ${{ needs.recover-preflight.outputs.commit }}
          RELEASE_TAG: ${{ needs.recover-preflight.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag,
            });
            if (release.draft || !release.published_at) {
              throw new Error(`Release ${tag} is no longer published`);
            }
            const { data: ref } = await github.rest.git.getRef({
              ...context.repo,
              ref: `tags/${tag}`,
            });
            const { data: annotatedTag } = await github.rest.git.getTag({
              ...context.repo,
              tag_sha: ref.object.sha,
            });
            if (
              ref.ref !== `refs/tags/${tag}` ||
              ref.object.type !== "tag" ||
              annotatedTag.tag !== tag ||
              annotatedTag.object.type !== "commit" ||
              annotatedTag.object.sha !== process.env.EXPECTED_COMMIT ||
              annotatedTag.verification?.verified !== true
            ) {
              throw new Error(`Release tag ${tag} changed or failed signature verification`);
            }

      - name: Recheck npm release ordering
        id: npm
        env:
          RELEASE_VERSION: ${{ needs.recover-preflight.outputs.version }}
        run: node trusted/.github/scripts/check-npm-release-state.mjs "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download verified npm artifact
        if: ${{ needs.recover-preflight.outputs.already_published != 'true' && steps.npm.outputs.already_published != 'true' }}
        env:
          ARTIFACT_NAME: ${{ needs.recover-preflight.outputs.artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir release-artifact

      - name: Publish to npm
        if: ${{ needs.recover-preflight.outputs.already_published != 'true' && steps.npm.outputs.already_published != 'true' }}
        env:
          IS_BETA: ${{ needs.recover-preflight.outputs.is_beta }}
        run: |
          set -Eeuo pipefail
          if [[ "$IS_BETA" == "true" ]]; then
            tag=beta
          else
            tag=latest
          fi
          node trusted/.github/scripts/publish-npm-tarball.mjs release-artifact "$tag"

      - name: Verify npm package and dist-tags
        env:
          RELEASE_VERSION: ${{ needs.recover-preflight.outputs.version }}
        run: node trusted/.github/scripts/verify-npm-release.mjs "$RELEASE_VERSION"

  restore-draft:
    if: ${{ always() && github.event_name == 'release' && (needs.preflight.result == 'failure' || needs.preflight.result == 'cancelled' || needs.publish.result == 'failure' || needs.publish.result == 'cancelled' || needs.publish.outputs.guard_failed == 'true') }}
    needs:
      - preflight
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Restore failed publication to draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const release = context.payload.release;
            if (!release?.id) throw new Error("Release event payload is missing its release id");
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              draft: true,
              prerelease: release.prerelease,
            });
            core.warning(
              `Restored ${release.tag_name} to draft because trusted preflight or publication failed or was cancelled`,
            );
