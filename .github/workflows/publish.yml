name: Publish Package

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional git ref to publish. Leave blank to use the selected branch or tag.
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Check if version already released
        id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          tag="v$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Package $name@$version already published to npm — skipping publish"
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Git tag $tag already exists (but npm version not found) — skipping publish"
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'skip=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify trusted publishing prerequisites
        if: steps.check.outputs.skip == 'false'
        run: |
          node --version
          npm --version
          node - <<'NODE'
          const cp = require('node:child_process');

          function assertAtLeast(label, actual, expected) {
            const actualParts = actual.replace(/^v/, '').split('.').map(Number);
            const expectedParts = expected.split('.').map(Number);
            for (let i = 0; i < expectedParts.length; i += 1) {
              if (actualParts[i] > expectedParts[i]) return;
              if (actualParts[i] < expectedParts[i]) {
                throw new Error(`${label} ${actual} is below required ${expected}`);
              }
            }
          }

          assertAtLeast('Node', process.version, '22.14.0');
          assertAtLeast('npm', cp.execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(), '11.5.1');
          NODE

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Type-check
        if: steps.check.outputs.skip == 'false'
        run: npm run typecheck

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: npm test

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public

      - name: Create and push release tag
        if: steps.check.outputs.skip == 'false'
        run: |
          tag="v${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

      - name: Create GitHub release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.check.outputs.version }}"
          gh release create "$tag" --generate-notes --verify-tag

      - name: Enrich release notes
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Get the top version block from CHANGELOG.md
          CHANGELOG_BLOCK=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          # Build enriched notes
          NPM_BADGE="📦 **npm:** \`npm install @donadiosolutions/lcm@${VERSION}\`"
          cat > release-notes.md <<EOF
          ${NPM_BADGE}

          ---

          ## Changelog

          ${CHANGELOG_BLOCK}

          ---

          🔖 [Full Changelog](https://github.com/donadiosolutions/lcm/blob/main/CHANGELOG.md)
          EOF
          gh release edit "v${VERSION}" --notes-file release-notes.md
